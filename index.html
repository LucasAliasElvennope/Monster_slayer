<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Monster Slayer</title>
</head>
<body>
  <header id="header">
    <h1 class="titre">Monster Slayer</h1>
  </header>
  <main>
    <section class="barres-de-vie">
      <div class="barre-de-vie">
        <h2 class="titre">Joueur</h2>
        <div class="barre-de-vie">
          <div id="vie-joueur" class="barre-de-vie"></div>
        </div>
      </div>
      <div class="barre-de-vie">
        <h2 class="titre">Monstre</h2>
        <div class="barre-de-vie">
          <div id="vie-monstre" class="barre-de-vie"></div>
        </div>
      </div>
    </section>
    <section class="actions">
      <button id="btn-attaque">⚔️ Attaquer</button>
      <button id="btn-special">💥 Attaque Spéciale</button>
      <button id="btn-soin">🧪 Se Soigner</button>
      <button id="btn-abandon">🏳️ Abandonner</button>
    </section>
    <section aria-label="Journal des actions" class="log-section">
      <h2 class="titre">Journal du Combat</h2>
      <ul id="log" class="combat-log"></ul>
    </section>
  </main>
  <script src="js/monster_slayer.js"></script>
  <footer id="footer">
    <p class="copyright">© 2025 Monster Slayer - Projet Front-End</p>
  </footer>
</body>
</html>
