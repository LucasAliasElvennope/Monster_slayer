</head>

        <div class="barre-de-vie">
          <div id="vie-joueur" class="barre-de-vie"></div>
        </div>
      </div>
      <div class="barre-de-vie">
        <h2>Monstre</h2>
        <div class="barre-de-vie">
          <div id="vie-monstre" class="barre-de-vie"></div>
        </div>
      </div>
    </section>
    <section class="actions">
      <button id="btn-attaque">⚔️ Attaquer</button>
      <button id="btn-special">💥 Attaque Spéciale</button>
      <button id="btn-soin">🧪 Se Soigner</button>

  </main>

</html>
